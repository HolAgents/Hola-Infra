# One-shot (idempotent) provisioning of the events-ledger database.
# Manual trigger only — see Hola-Infra#36.
name: Provision PolarDB

on:
  workflow_dispatch:
    inputs:
      recreate_orphan:
        description: 'Delete + recreate an existing cluster whose password is lost'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      whitelist_cidr:
        description: 'Whitelist CIDR to set on the cluster (diagnostics: 0.0.0.0/0)'
        required: false
        default: '10.10.0.0/16'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    name: Provision PolarDB Serverless (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assume RAM Role via OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIBABA_CLOUD_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com

      - name: Install aliyun CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure set --mode StsToken --profile default \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN" \
            --region cn-hangzhou
          aliyun version

      - name: Provision cluster + account + databases
        env:
          # Optional: when set, an existing cluster's account password is
          # rotated to this value in place instead of deleting/recreating
          # the cluster (the creating run's password dies with its runner;
          # the repo is public so the value travels only via secrets).
          HOLA_DB_NEW_PW: ${{ secrets.HOLA_DB_TMP_PW }}
          # Recreate only on explicit opt-in — a missing secret must not
          # destroy a healthy cluster.
          RECREATE_ORPHAN: ${{ inputs.recreate_orphan || '0' }}
          WHITELIST_CIDR: ${{ inputs.whitelist_cidr || '10.10.0.0/16' }}
        run: bash scripts/provision_polardb.sh

      - name: Verify FC functions reach the database
        env:
          FC_URL_STAGING: ${{ vars.FC_URL_STAGING }}
          FC_URL_PROD: ${{ vars.FC_URL_PROD }}
        run: |
          for URL in "$FC_URL_STAGING" "$FC_URL_PROD"; do
            [ -n "$URL" ] || continue
            for ATTEMPT in 1 2 3; do
              echo "healthz $URL (attempt $ATTEMPT)"
              RESP=$(curl -s -m 20 "$URL/healthz" || echo '{"db":"curl-failed"}')
              echo "$RESP"
              echo "$RESP" | grep -q '"db":"ok"' && break
              [ "$ATTEMPT" = "3" ] && { echo "FATAL: db not ok for $URL"; exit 1; }
              sleep 5
            done
          done
