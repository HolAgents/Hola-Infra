name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r fc/requirements.txt
          pip install -r dispatcher/requirements.txt
          pip install pytest
      - name: Run tests (SQLite backend)
        env:
          GITHUB_WEBHOOK_SECRET: ci_test_secret
          API_KEY: ci_test_api_key
          DB_PATH: /tmp/ci_test.db
        run: python -m pytest tests/ -v --tb=short
      - name: Run tests (PostgreSQL backend)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/test_repository_pg.py -v --tb=short

  fc-smoke:
    name: FC deployability smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r fc/requirements.txt httpx
      - name: Smoke test
        working-directory: fc
        env:
          GITHUB_WEBHOOK_SECRET: ci_test_secret
          API_KEY: ci_test_api_key
          DB_PATH: /tmp/ci_smoke.db
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 9876 &
          UVICORN_PID=$!
          sleep 3

          echo "=== healthz ==="
          curl -sf http://localhost:9876/healthz

          echo "=== ingest ==="
          PAYLOAD='{"action":"opened","issue":{"number":1,"node_id":"I_1","title":"test"},"repository":{"full_name":"HolAgents/test"},"sender":{"login":"test-user"}}'
          SIGNATURE=$(python -c "
          import hashlib,hmac
          s=b'ci_test_secret'
          b='$PAYLOAD'.encode()
          print('sha256='+hmac.new(s,b,hashlib.sha256).hexdigest())
          ")
          curl -sf -X POST http://localhost:9876/api/webhooks/github \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: issues" \
            -H "X-GitHub-Delivery: ci-test-001" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "=== claim ==="
          CLAIM=$(curl -sf -X POST http://localhost:9876/api/events/claim \
            -H "X-API-Key: ci_test_api_key" \
            -H "Content-Type: application/json" \
            -d '{"limit":10}')
          EVENT_ID=$(echo "$CLAIM" | python -c "import sys,json;print(json.load(sys.stdin)['events'][0]['id'])")
          CLAIM_TOKEN=$(echo "$CLAIM" | python -c "import sys,json;print(json.load(sys.stdin)['events'][0]['claim_token'])")

          echo "=== ack ==="
          curl -sf -X POST http://localhost:9876/api/events/ack \
            -H "X-API-Key: ci_test_api_key" \
            -H "Content-Type: application/json" \
            -d "{\"results\":[{\"event_id\":$EVENT_ID,\"claim_token\":\"$CLAIM_TOKEN\",\"status\":\"completed\"}]}"

          echo "=== verify ==="
          curl -sf http://localhost:9876/api/events/$EVENT_ID -H "X-API-Key: ci_test_api_key"

          echo ""
          echo "=== ALL SMOKE TESTS PASSED ==="
          kill $UVICORN_PID

  fc-package-check:
    name: Validate FC package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match the FC runtime (python3.10): pip evaluates dependency
          # markers against this version, so building under 3.12 silently
          # drops py<3.11 deps (exceptiongroup) and cp310 wheels.
          python-version: "3.10"
      - name: Install deps into package dir (same as FC deploy)
        working-directory: fc
        run: pip install -r requirements.txt -t .
      - name: Verify uvicorn can boot (cold start simulation)
        working-directory: fc
        env:
          GITHUB_WEBHOOK_SECRET: ci_test_secret
          API_KEY: ci_test_api_key
          DB_PATH: /tmp/fc_pkg_test.db
        run: |
          PYTHONPATH="..:$PYTHONPATH" python -c "
          import uvicorn, fastapi, pydantic, pydantic_settings
          print('All deps importable: OK')
          # Runtime-only deps that used to slip through 3.12 builds:
          import exceptiongroup, anyio, pydantic_core, a2wsgi
          print('Runtime deps (exceptiongroup, anyio, pydantic_core, a2wsgi): OK')
          from fc.main import app
          print('App imported: OK')
          print('Routes:', [r.path for r in app.routes if hasattr(r, 'path')])
          "

  validate-config:
    name: Validate s.yaml configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML structure
        run: |
          python -c "
          import yaml
          for path in ('fc/s.yaml', 'fc/s.staging.yaml'):
              cfg = yaml.safe_load(open(path))
              svc = cfg['services']['hola-webhook']
              assert svc['component'] == 'fc'
              assert svc['props']['region'] == 'cn-hangzhou'
              assert svc['props']['function']['runtime'] in ('custom', 'python3.10')
              assert svc['props']['function']['instanceConcurrency'] == 1
              print(f'{path}: OK')
          "

  deploy-staging:
    name: Deploy to FC (staging)
    runs-on: ubuntu-latest
    needs: [test, fc-smoke, fc-package-check, validate-config]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # FC runtime is python3.10 — build the package with matching
          # dependency markers/wheels (see fc-package-check).
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Assume RAM Role via OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIBABA_CLOUD_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com

      - name: Configure Serverless Devs access
        run: |
          s config add \
            --access default \
            --AccountID ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }} \
            --AccessKeyID $ALIBABA_CLOUD_ACCESS_KEY_ID \
            --AccessKeySecret $ALIBABA_CLOUD_ACCESS_KEY_SECRET \
            --SecurityToken $ALIBABA_CLOUD_SECURITY_TOKEN

      - name: Install Python deps
        working-directory: fc
        run: pip install -r requirements.txt -t .

      - name: Deploy to staging
        working-directory: fc
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET_STAGING }}
          API_KEY: ${{ secrets.API_KEY_STAGING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          VPC_ID: ${{ vars.VPC_ID }}
          VSWITCH_ID: ${{ vars.VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID }}
        run: s deploy -y --use-local -t s.staging.yaml

  deploy-production:
    name: Deploy to FC (production)
    runs-on: ubuntu-latest
    needs: [test, fc-smoke, fc-package-check, validate-config]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # FC runtime is python3.10 — build the package with matching
          # dependency markers/wheels (see fc-package-check).
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Assume RAM Role via OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIBABA_CLOUD_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com

      - name: Configure Serverless Devs access
        run: |
          s config add \
            --access default \
            --AccountID ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }} \
            --AccessKeyID $ALIBABA_CLOUD_ACCESS_KEY_ID \
            --AccessKeySecret $ALIBABA_CLOUD_ACCESS_KEY_SECRET \
            --SecurityToken $ALIBABA_CLOUD_SECURITY_TOKEN

      - name: Install Python deps
        working-directory: fc
        run: pip install -r requirements.txt -t .

      - name: Deploy to production
        working-directory: fc
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VPC_ID: ${{ vars.VPC_ID }}
          VSWITCH_ID: ${{ vars.VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID }}
        run: s deploy -y --use-local
