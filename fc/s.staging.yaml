# -------------------------------------------
# Hola Infra — FC Webhook Service (STAGING)
# -------------------------------------------
# Separate staging environment: own service/function names, own NAS,
# own HTTP trigger. Deployed via `s deploy -y --use-local -t s.staging.yaml`
# with staging secrets injected by the CI deploy-staging job.
# -------------------------------------------

edition: 1.0.0
name: hola-webhook-fc-staging
access: "default"

services:
  hola-webhook:
    component: fc
    props:
      region: cn-hangzhou
      service:
        name: hola-webhook-service-staging
        description: GitHub webhook receiver (staging) with PostgreSQL on PolarDB
        internetAccess: true
        # Dedicated user VPC (the FC-managed DefaultNas VPC rejects user
        # resources — Hola-Infra#36). Values come from the provisioning
        # workflow output (repo variables). FC 2.0: VPC is a SERVICE-level
        # setting — a function-level vpcConfig is silently dropped (that
        # is why the deployed functions ran without a VPC path).
        vpcConfig:
          vpcId: ${env.VPC_ID}
          securityGroupId: ${env.SECURITY_GROUP_ID}
          vSwitchIds:
            - ${env.VSWITCH_ID}
      function:
        name: webhook-ingest-staging
        runtime: python3.10
        codeUri: ./
        memorySize: 256
        timeout: 30
        instanceConcurrency: 1
        environmentVariables:
          GITHUB_WEBHOOK_SECRET: ${env.GITHUB_WEBHOOK_SECRET}
          API_KEY: ${env.API_KEY}
          # PostgreSQL backend (PolarDB Serverless) — when unset, the
          # SQLite fallback at DB_PATH is used instead.
          DATABASE_URL: ${env.DATABASE_URL}
          # SQLite FALLBACK ONLY — the ledger lives in PolarDB when
          # DATABASE_URL is set; this path is ephemeral instance storage.
          DB_PATH: /tmp/events-fallback.db
          LOG_LEVEL: INFO
      triggers:
        - type: http
          name: webhook-http
          qualifier: LATEST
          config:
            authType: anonymous
            methods:
              - GET
              - POST
