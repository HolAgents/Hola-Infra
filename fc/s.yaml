# -------------------------------------------
# Hola Infra — FC Webhook Service
# Serverless Devs (FC 3.0) deployment config
# -------------------------------------------
# Usage:
#   1. s nas init          (once — creates NAS + VPC)
#   2. s deploy            (push code + trigger)
#   3. Register the HTTP trigger URL as GitHub org webhook
# -------------------------------------------

edition: 1.0.0
name: hola-webhook-fc
access: "default"

services:
  hola-webhook:
    component: fc
    props:
      region: cn-hangzhou
      service:
        name: hola-webhook-service
        description: GitHub webhook receiver with PostgreSQL on PolarDB
        internetAccess: true
      function:
        name: webhook-ingest
        runtime: python3.10
        codeUri: ./
        memorySize: 256
        timeout: 30
        instanceConcurrency: 1
        # Dedicated user VPC (the FC-managed DefaultNas VPC rejects user
        # resources — Hola-Infra#36). Values come from the provisioning
        # workflow output (repo variables).
        vpcConfig:
          vpcId: ${env.VPC_ID}
          securityGroupId: ${env.SECURITY_GROUP_ID}
          vSwitchIds:
            - ${env.VSWITCH_ID}
        nasConfig:
          userId: 10003
          groupId: 10003
          mountPoints:
            - serverAddr: ${env.NAS_SERVER_ADDR}
              mountDir: /mnt/auto
        environmentVariables:
          GITHUB_WEBHOOK_SECRET: ${env.GITHUB_WEBHOOK_SECRET}
          API_KEY: ${env.API_KEY}
          # PostgreSQL backend (PolarDB Serverless) — when unset, the
          # SQLite fallback at DB_PATH is used instead.
          DATABASE_URL: ${env.DATABASE_URL}
          # FC3 nasConfig:auto mounts the NAS at /mnt/auto (NOT /mnt/nas).
          # /mnt/nas was ephemeral instance storage — data vanished on
          # every cold start.
          DB_PATH: /mnt/auto/events.db
          LOG_LEVEL: INFO
      triggers:
        - type: http
          name: webhook-http
          qualifier: LATEST
          config:
            authType: anonymous
            methods:
              - GET
              - POST
